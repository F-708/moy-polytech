name: Content Pack

# Сборка контент-пакета при изменении справочников.
# Фото (content/teachers_photos/**) сюда намеренно НЕ входят: их обрабатывает
# photo-optimize.yml — сжимает и затем вызывает тот же content-pack-build.yml.
on:
  push:
    branches: [main]
    paths:
      - 'content/teachers.csv'
      - 'content/group_codes.csv'
      - 'content/college_map.json'
      - '.github/workflows/content-pack.yml'
      - '.github/workflows/content-pack-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка контент-пакета
    uses: ./.github/workflows/content-pack-build.yml
    permissions:
      contents: write
